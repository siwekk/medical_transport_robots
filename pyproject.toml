[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tase-hospital-dispatch-reproduction"
version = "0.1.0"
description = "Reproduction of coupled hospital delivery dispatch experiments"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = ["matplotlib>=3.8,<4", "networkx>=3.2,<4", "numpy>=1.26,<3", "pandas>=2.2,<4", "PyYAML>=6,<7", "simpy>=4.1,<5"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
